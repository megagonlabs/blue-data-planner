[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-planner-mcp"
version = "0.1.0"
description = "blue-data-planner-mcp — the MCP server over blue-data-planner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "blue-data-planner==0.1.0",
    # mcp 2.0 removed FastMCP for mcp.server.mcpserver.MCPServer. Every Blue Data server is on
    # v1, and moving is one decision for the family rather than for this package.
    "mcp[cli]>=1.0.0,<2.0.0",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "pyright", "build", "twine"]

[project.scripts]
blue-data-planner-mcp = "blue_data_planner_mcp.server:main"

[tool.uv.sources]
# Local development installs. Replace with a package index at release, the way lib/ documents.
blue-data-planner = { path = "../../lib", editable = true }
# blue-data and blue-data-ops come from sibling checkouts beside this repository, and stay
# listed here because uv resolves a path dependency's sources from the root project.
blue-data-ops = { path = "../../../blue-data-ops/lib", editable = true }
blue-data = { path = "../../../blue-data/lib", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests/unit"]
