[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-planner-cli"
version = "1.0.0"
description = "blue-planner — the command line over blue-data-planner"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    {name = "Naoki Otani"},
]
maintainers = [
    {name = "Naoki Otani"},
]
dependencies = [
    "blue-data-planner==1.0.0",
    "blue-data>=1.0.0",
    "click>=8",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyright", "build", "twine"]

[project.scripts]
blue-planner = "blue_data_planner_cli.commands:main"

[tool.uv.sources]
# Local development installs. Replace with a package index at release, the way lib/ documents.
blue-data-planner = { path = "../../lib", editable = true }
# blue-data and blue-data-ops come from sibling checkouts beside this repository, and stay
# listed here because uv resolves a path dependency's sources from the root project.
blue-data-ops = { path = "../../../blue-data-ops/lib", editable = true }
blue-data = { path = "../../../blue-data/lib", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blue_data_planner_cli = ["profile_spec.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
