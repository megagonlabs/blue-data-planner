[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-planner"
version = "0.1.0"
description = "Blue Data Planner — operator-agnostic planning over the Blue Data Intelligence Layer"
readme = "README.md"
requires-python = ">=3.11"
# blue-data-ops is pinned exactly: the adapter binds plans against what each operator
# declares, so a floating version would change which fragments are coverable between runs.
dependencies = [
    "blue-data-ops==2.3.0",
    "blue-data>=0.1.0",
    "pydantic>=2",
    "jsonpath-ng",
    "tenacity",
    "litellm",
    "jinja2",
]

[tool.uv.sources]
# Installing blue-data and blue-data-ops from GitHub for developing.
# TODO: replace this with a package index when we release the blue-data-planner library.
blue-data-ops = { git = "ssh://git@github.com/megagon-internal/blue-data-ops.git", subdirectory = "lib", rev = "c0830feac8b223093b5619288a09a91425aaa76d" }
blue-data = { git = "ssh://git@github.com/megagon-internal/blue-data.git", subdirectory = "lib", rev = "f39abf96a84a3ed9677006b6363b7b9f4510a88a" }

[project.optional-dependencies]
dev = [
    # diskcache backs the optional llm.cache path; without it three cache tests fail.
    "diskcache",
    "pytest",
    "ruff",
    "pyright",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blue_data_planner = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# tests/stubs holds deterministic fakes for optional heavy deps; pyright resolves them for
# analysis, pytest via conftest.
extraPaths = ["src", ".", "tests/stubs"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests/unit"]
