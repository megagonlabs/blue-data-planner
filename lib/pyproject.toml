[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-planner"
version = "0.1.0"
description = "Blue Data Planner — operator-agnostic planning over the Blue Data Intelligence Layer"
readme = "README.md"
requires-python = ">=3.11"
# blue-data-ops is pinned exactly: the adapter binds plans against what each operator
# declares, so a floating version would change which fragments are coverable between runs.
dependencies = [
    "blue-data-ops==2.10.0",
    "blue-data>=0.1.0",
    "pydantic>=2",
    "jsonpath-ng",
    "tenacity",
    "litellm",
    "jinja2",
]

[tool.uv.sources]
# Installing blue-data and blue-data-ops from GitHub for developing.
# TODO: replace this with a package index when we release the blue-data-planner library.
blue-data-ops = { git = "ssh://git@github.com/megagon-internal/blue-data-ops.git", subdirectory = "lib", rev = "a161d9eaf8511fab3820b50a6dd00cba235ec8a8" }
blue-data = { git = "ssh://git@github.com/megagon-internal/blue-data.git", subdirectory = "lib", rev = "f39abf96a84a3ed9677006b6363b7b9f4510a88a" }

[project.optional-dependencies]
dev = [
    # diskcache backs the optional llm.cache path; without it three cache tests fail.
    "diskcache",
    "pytest",
    "ruff",
    "pyright",
]
# LOTUS narrows numpy, pandas, and the Python range, so it is an extra rather than a
# dependency, and the tier that uses it gets an environment of its own.
lotus = ["lotus-ai>=1.2,<2"]

# uv computes one resolution across every extra by default, so lotus's numpy/pandas upper
# bounds would otherwise apply to the default install too, even though a plain `uv sync`
# never requests the extra. Declaring lotus as conflicting forks the resolution instead,
# leaving the default environment on whatever blue-data-ops/blue-data naturally pull in.
# uv 0.12 requires a conflict set to name two members, and has no syntax for "conflicts with
# no extras selected"; no-lotus is arity padding for that requirement, not a real dependency
# group, and nothing installs it on its own. Drop it once astral-sh/uv#10154 lands a
# "conflicts with no extras" syntax (that issue's own workaround pairs the extra against a
# non-empty default group, not an empty inert one — this empty-group form is a simplification
# that happens to work here, not something the issue demonstrates).
# --all-extras and --all-groups together now request lotus and no-lotus at once, which the
# conflict declaration forbids, so that combination errors.
[dependency-groups]
no-lotus = []

[tool.uv]
conflicts = [
    [
        { extra = "lotus" },
        { group = "no-lotus" },
    ],
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blue_data_planner = ["py.typed", "prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# tests/stubs holds deterministic fakes for optional heavy deps; pyright resolves them for
# analysis, pytest via conftest.
extraPaths = ["src", ".", "tests/stubs"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests/unit"]
